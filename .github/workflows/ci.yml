name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Package extension
        run: cd extension && zip -r ../unspoiled.zip . -x '.*'

      - uses: actions/upload-artifact@v4
        with:
          name: unspoiled-${{ github.sha }}
          path: unspoiled.zip
